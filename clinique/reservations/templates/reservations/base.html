<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Réservations{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'show_list' %}">
            <i class="bi bi-ticket-perforated-fill me-2"></i>Réservations
        </a>
        <div class="d-flex align-items-center gap-3">
            <a href="{% url 'show_list' %}" class="text-white text-decoration-none">
                <i class="bi bi-house me-1"></i>Spectacles
            </a>
            {% if user.is_authenticated %}
                <span class="badge bg-light text-dark">
                    <i class="bi bi-person-fill me-1"></i>{{ user.username }}
                    {% if user.is_staff %}
                        <span class="badge bg-danger ms-1">Admin</span>
                    {% endif %}
                </span>
            {% else %}
                <a href="/admin/" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Connexion Admin
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
